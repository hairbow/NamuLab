  <!--
    Supabase Database setup (run once in Supabase SQL Editor; never in the browser):

    create table if not exists public.users (
      user_id text primary key,
      nickname text not null default '',
      country text not null check (country in ('KZ','KR','US')),
      eco bigint not null default 0,
      streak integer not null default 0,
      state_json jsonb not null default '{}'::jsonb,
      updated_at timestamptz not null default now()
    );
    create index if not exists namulab_users_eco_idx on public.users (eco desc);
    create index if not exists namulab_users_streak_idx on public.users (streak desc);

    -- Run the following diagnostic SELECT first; resolve duplicates if any:
    -- select lower(btrim(nickname)) as reserved_name,
    --        count(*) as duplicates, array_agg(user_id) as user_ids
    -- from public.users group by lower(btrim(nickname)) having count(*) > 1;
    -- Then make nickname reservations atomic across browsers and devices:
    create unique index if not exists namulab_users_nickname_unique
      on public.users (lower(btrim(nickname)));

    -- Reserve all 10 demonstration competitors at the database level, too.
    -- If old records contain their names, rename those records first.
    do $$
    begin
      if not exists (
        select 1 from pg_constraint
        where conrelid='public.users'::regclass
        and conname='namulab_nickname_not_demo'
      ) then
        alter table public.users add constraint namulab_nickname_not_demo
          check (lower(btrim(nickname)) not in
          ('aigerim','jiwoo','daniel','daniyar','minjun','olivia',
           'aruzhan','seoyeon','ethan','madi'));
      end if;
    end;
    $$;

    create or replace function public.get_country_totals()
    returns table(country text,total_eco bigint)
    language sql stable security invoker
    as $$
      select u.country, sum(u.eco)::bigint from public.users u group by u.country
    $$;

    SECURITY: This client can call the table only with permissions allowed by
    Supabase Row Level Security and PostgreSQL GRANTs. Do NOT enable unrestricted
    anonymous UPDATE / INSERT on users: it would let anybody forge identities,
    change ECO balances and overwrite someone else's progress. For production,
    verify Telegram initData cryptographically on the server (Edge Function),
    use Supabase Auth and RLS, and check rewards server-side. A publishable key
    is public; the Telegram user_id read in browser is NOT verified authentication.
    The HTML is a functional client, not a secure replacement for that backend.
  -->
  <!--
    NamuLab: public.app_settings must contain row id=1 with columns
    id (integer), announcement_text (text), is_active (boolean).
    Admin UI PIN opens the panel, but it cannot grant PostgreSQL permissions.
    Supabase RLS and GRANTs control who can UPDATE public.app_settings/users.
    Do NOT grant anonymous public UPDATE/DELETE to these tables simply to make
    this demo admin panel work: the PIN is visible in the delivered HTML.
    Production management requires Supabase Auth + an owner-only RLS policy
    (or other server-verified authorization), without exposing secret keys.
  -->

function uniqueStrings(input,max=10000) {
  return Array.isArray(input) ? [...new Set(input.filter(x => typeof x==='string' && x.length && x.length<180))].slice(0,max) : [];
}
function validCountry(code) { return COUNTRIES.includes(String(code||'').toUpperCase()) ? String(code).toUpperCase() : null; }
function safeNumber(value,fallback=0) { return Number.isFinite(value) ? Math.max(0,Math.min(1e9,Math.floor(value))) : fallback; }
function safeWikiUrl(url) {
  try {const u=new URL(String(url||''));return u.protocol==='https:' && /^((ru|en|ko)\.wikipedia\.org|www\.wikidata\.org)$/.test(u.hostname) ? u.href : '';} catch {return '';}
}
function wikiArticleUrl(lang,title) {return `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(String(title).replace(/ /g,'_'))}`;}
function cleanFavorite(item) {
  if (!item || typeof item!=='object' || typeof item.id!=='string' || !item.versions) return null;
  const versions={};
  for (const lang of ['ru','en','ko']) {
    const part=item.versions[lang] || {};
    versions[lang]={title:String(part.title||'').slice(0,180),summary:String(part.summary||'').slice(0,550),hasArticle:Boolean(part.hasArticle),source:String(part.source||'NamuLab'),url:safeWikiUrl(part.url)};
  }
  return {id:item.id.slice(0,180),query:String(item.query||'').slice(0,90),local:Boolean(item.local),termId:String(item.termId||''),versions};
}
function cleanSession(input) {
  if (!input || typeof input!=='object' || !Array.isArray(input.questions) || input.questions.length!==10) return null;
  const known=new Set(TERMS_DB.map(x=>x.id));
  if (!input.questions.every(q=>known.has(q.termId) && ['translation','definition'].includes(q.kind) &&
       ['ru','en','ko'].includes(q.answerLang) && Array.isArray(q.optionIds) && q.optionIds.length===4 &&
       new Set(q.optionIds).size===4 && q.optionIds.every(id=>known.has(id)) && q.optionIds.includes(q.termId))) return null;
  const answers=Array.isArray(input.answers) ? input.answers.slice(0,10).map(x=>Number.isInteger(x) && x>=0 && x<=3?x:null) : [];
  return {questions:input.questions,answers,index:Math.min(9,Math.max(0,safeNumber(input.index))),finished:Boolean(input.finished),rewarded:Boolean(input.rewarded),passed:Boolean(input.passed)};
}
function cleanCaseAttempts(source) {
  const result={};
  if(!source || typeof source!=='object' || Array.isArray(source))return result;
  for(const item of LAB_CASES_DB) {
    const previous=source[item.id];
    if(!previous || typeof previous!=='object')continue;
    result[item.id]={
      attempts:Math.min(100000,safeNumber(previous.attempts)),
      lastChoice:Number.isInteger(previous.lastChoice) && previous.lastChoice>=0 && previous.lastChoice<4 ? previous.lastChoice : null

  }
  return result;
}

function getPersistentState(){
  const result={};
  for(const key of PERSIST_KEYS)result[key]=APP_STATE[key];
  return result;
}
function storeLocalEnvelope(state){
  try {
    localStorage.setItem(CLOUD_LOCAL_KEY,JSON.stringify({state,editedAt:localEditedAt,dirty:localDirty}));
  } catch(error) {console.info('Local progress storage unavailable',error);}
}
function persist() {
  const state=getPersistentState();
  const snapshot=JSON.stringify(state);
  if(snapshot===lastSavedSnapshot)return;
  lastSavedSnapshot=snapshot;
  if(!applyingCloudState){
    localEditedAt=Date.now();
    localDirty=true;
  }
  storeLocalEnvelope(state);
  if(!applyingCloudState && cloudBootstrapped) scheduleCloudSave();
}
function commitLocalCache(){storeLocalEnvelope(getPersistentState());}

function t(key) {
  const item=UI[APP_STATE.language]?.[key];
  return typeof item==='string'?item.replaceAll('{count}',String(TERMS_DB.length)):item??key;
}
function esc(value) {return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function localeNumber(n) {return Number(n).toLocaleString(APP_STATE.language==='ko'?'ko-KR':APP_STATE.language==='en'?'en-US':'ru-RU');}
function streakUnit(n) {
  if(APP_STATE.language==='ko') return '일';if(APP_STATE.language==='en') return n===1?'day':'days';
  if(n%10===1&&n%100!==11)return t('streakOne');if(n%10>=2&&n%10<=4&&(n%100<12||n%100>14))return t('streakFew');return t('streakMany');
}
function todayISO() {const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
const SEARCH_DAILY_REWARD_LIMIT=5;
function syncDailySearchRewards() {
  const today=todayISO();
  const saved=APP_STATE.dailySearchRewards;
  if(!saved || saved.date!==today) {
    APP_STATE.dailySearchRewards={date:today,count:0};
  } else {
    saved.count=Math.max(0,Math.min(SEARCH_DAILY_REWARD_LIMIT,safeNumber(saved.count)));
  }
}
function remainingSearchRewards() {
  syncDailySearchRewards();
  return SEARCH_DAILY_REWARD_LIMIT-APP_STATE.dailySearchRewards.count;
}
function dateDifference(a,b) {return Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/86400000);}
function effectiveStreak() {return APP_STATE.lastStudyDate && dateDifference(APP_STATE.lastStudyDate,todayISO())>1?0:APP_STATE.streak;}
function recordStudyDay() {
  const now=todayISO();if(APP_STATE.lastStudyDate!==now){
    const days=APP_STATE.lastStudyDate?dateDifference(APP_STATE.lastStudyDate,now):null;
    APP_STATE.streak=days===1?Math.max(1,APP_STATE.streak)+1:1;APP_STATE.lastStudyDate=now;
  }
}
function rewardEco(n) {recordStudyDay();APP_STATE.eco+=n;haptic();}
function haptic() {try {telegram?.HapticFeedback?.impactOccurred('light');}catch{}}
function toast(message) {const box=document.getElementById('toast');box.textContent=message;box.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.remove('show'),2800);}
function getCourseTerms() {return APP_STATE.selectedLevel==='all'?TERMS_DB:TERMS_DB.filter(term=>term.level===APP_STATE.selectedLevel);}
function getCurrentTerm() {
  if(APP_STATE.focusTermId){const focus=TERMS_DB.find(term=>term.id===APP_STATE.focusTermId);if(focus)return focus;}
  const learned=new Set(APP_STATE.learnedIds);return getCourseTerms().find(term=>!learned.has(term.id))||null;
}
function getExamAccuracy() {const x=APP_STATE.examStats;return x.total?x.correct/x.total:0;}
function getExamReadiness() {
  const learned=Math.min(1,APP_STATE.learnedIds.length/TERMS_DB.length);
  const accuracy=Math.min(1,getExamAccuracy());
  const solved=Math.min(1,APP_STATE.solvedCaseIds.length/LAB_CASES_DB.length);
  return Math.round(100*(.45*learned+.30*accuracy+.25*solved));
}
function getAchievementTitle() {
  const readiness=getExamReadiness();
  return t(readiness>=75?'rankResearcher':readiness>=50?'rankJunior':readiness>=25?'rankAssistant':'rankBeginner');
}

const LAST_RENDERED_MARKUP = new WeakMap();

function paintIfChanged(element, html) {
  if (LAST_RENDERED_MARKUP.get(element) === html) return false;
  element.innerHTML = html;
  LAST_RENDERED_MARKUP.set(element, html);
  return true;
}

function setCaseFilter(raw) {
  const level=raw==='all'?'all':Number(raw);

function selectCase(id) {
  if(!LAB_CASES_DB.some(item=>item.id===id))return;
  APP_STATE.caseActiveId=id;renderAll();haptic();

function answerCase(choice) {
  const item=getActiveCase();
  if(!item || !Number.isInteger(choice) || choice<0 || choice>3)return;
  const previous=APP_STATE.caseAttempts[item.id];
  if(previous && previous.lastChoice!==null && previous.lastChoice!==undefined)return;
  APP_STATE.caseActiveId=item.id;
  APP_STATE.caseAttempts[item.id]={attempts:(previous?.attempts||0)+1,lastChoice:choice};
  const correct=choice===item.correctIndex;
  if(correct){
    APP_STATE.weakTermIds=APP_STATE.weakTermIds.filter(id=>id!==item.relatedTermId);
    if(!APP_STATE.solvedCaseIds.includes(item.id)){
      APP_STATE.solvedCaseIds.push(item.id);
      rewardEco(item.reward);
      toast(`${t('caseRewardEarned')} +${item.reward} ECO 🌱`);
    }else{recordStudyDay();haptic();toast(t('caseAlreadyRewarded'));}
  } else {
    if(!APP_STATE.weakTermIds.includes(item.relatedTermId))APP_STATE.weakTermIds.push(item.relatedTermId);
    recordStudyDay();
  }
  renderAll();
}
function retryCase() {
  const item=getActiveCase();if(!item)return;
  const previous=APP_STATE.caseAttempts[item.id];
  APP_STATE.caseAttempts[item.id]={attempts:previous?.attempts||0,lastChoice:null};
  renderAll();
}

function shuffle(items) {
  const list=[...items];
  for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
  return list;
}
function createExam() {
  const available=getCourseTerms();
  const learned=new Set(APP_STATE.learnedIds),review=new Set(APP_STATE.weakTermIds);
  const weighted=available.map(term=>({
    term,score:Math.pow(Math.random(),1/(1+(learned.has(term.id)?1.3:0)+(review.has(term.id)?5:0)))
  })).sort((a,b)=>b.score-a.score);
  const chosen=weighted.slice(0,10).map(obj=>obj.term);
  const questions=chosen.map((term,i)=>{
    const same=TERMS_DB.filter(x=>x.id!==term.id && x.level===term.level);
    const related=shuffle(same.filter(x=>x.category===term.category));
    const other=shuffle(same.filter(x=>x.category!==term.category));
    const options=shuffle([term,...[...related,...other].slice(0,3)]);
    return {termId:term.id,kind:i%2===0?'translation':'definition',answerLang:'en',optionIds:options.map(x=>x.id)};
  });
  APP_STATE.examSession={questions,answers:[],index:0,finished:false,rewarded:false,passed:false};
  recordStudyDay();renderAll();
}
function answerExam(optionIndex) {
  const session=APP_STATE.examSession;
  if(!session || session.finished || session.answers[session.index]!==undefined) return;
  const question=session.questions[session.index];
  if(!Number.isInteger(optionIndex)||optionIndex<0||optionIndex>=4)return;
  const correct=question.optionIds[optionIndex]===question.termId;
  session.answers[session.index]=optionIndex;
  APP_STATE.examStats.total++;
  if(correct) {
    APP_STATE.examStats.correct++;
    APP_STATE.weakTermIds=APP_STATE.weakTermIds.filter(id=>id!==question.termId);
  } else if(!APP_STATE.weakTermIds.includes(question.termId)) {
    APP_STATE.weakTermIds.push(question.termId);
  }
  recordStudyDay();haptic();renderAll();
}
function advanceExam() {
  const s=APP_STATE.examSession;
  if(!s || s.answers[s.index]===undefined || s.finished)return;
  if(s.index<9) {s.index++;renderAll();return;}
  s.finished=true;
  APP_STATE.examStats.attempts++;
  const points=s.questions.reduce((sum,q,i)=>sum+(q.optionIds[s.answers[i]]===q.termId?1:0),0);
  s.passed=points>=8;
  if(s.passed) {
    APP_STATE.examStats.passed++;
    const key=s.questions.map(q=>q.termId).sort().join('|');
    if(!APP_STATE.examRewardKeys.includes(key)) {
      APP_STATE.examRewardKeys.push(key);
      rewardEco(30);s.rewarded=true;
      toast(`${t('examPass')} +30 ECO 🌱`);
    } else {s.rewarded=false;toast(t('examRewardRepeat'));}
  } else toast(t('examSaved'));
  renderAll();
}

// ============================================
// Hybrid Encyclopedia: local -> Wikipedia / Wikidata (4s total)
// -> three local suggestions with no unhandled API errors.
// ============================================
const WIKI_LANGUAGES=['ru','en','ko'];
function cleanSearchText(value) {return String(value||'').normalize('NFC').trim().replace(/\s+/g,' ').slice(0,90);}
function normalizedQuery(value) {
  return cleanSearchText(value).toLocaleLowerCase().replace(/[\u200b\u00ad]/g,'').replace(/[()\[\]{}:;.,!?–—\-_/\\]/g,' ').replace(/\s+/g,' ').trim();
}
function trimScientificText(value) {
  const valueText=String(value||'').replace(/\s+/g,' ').trim();
  if(valueText.length<=480)return valueText;
  const cut=valueText.slice(0,475),last=cut.lastIndexOf(' ');
  return cut.slice(0,last>280?last:475)+'…';
}
function guessWikiLanguage(value) {
  return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(value)?'ko':/[А-Яа-яЁё]/.test(value)?'ru':'en';
}
function getLocalTerm(query) {
  const normalized=normalizedQuery(query);
  if(!normalized)return null;
  const scored=[];
  for(const term of TERMS_DB){
    let best=0;
    for(const lang of WIKI_LANGUAGES){
      const text=normalizedQuery(term[lang]);
      if(text===normalized)best=Math.max(best,100);
      else if(text.startsWith(normalized) && normalized.length>=3)best=Math.max(best,60);
      else if(text.includes(normalized) && normalized.length>=4)best=Math.max(best,30);
    }
    if(best)scored.push({term,score:best});
  }
  scored.sort((a,b)=>b.score-a.score || TERMS_DB.indexOf(a.term)-TERMS_DB.indexOf(b.term));
  return scored[0]?.term||null;
}
function makeLocalResult(term,query) {
  const versions={};for(const lang of WIKI_LANGUAGES){
    versions[lang]={title:term[lang],summary:term.info[lang],hasArticle:false,source:'NamuLab',url:''};
  }
  return {id:`namulab:${term.id}`,query:query||term.ru,termId:term.id,local:true,versions};
}
function getSearchSuggestions(query) {
  const key=normalizedQuery(query),chosen=new Set(),topics=[];
  const synonymTopic=[
    {pattern:/bacter|бактер|세균|фаг|phage|파지|virus|вирус|바이러스/,ids:['virus','bacteria','dna']},
    {pattern:/mitochond|митохонд|미토콘드|atp|energy|энерг|에너지/,ids:['mitochondrion','atp','glycolysis']},
    {pattern:/gene|ген|유전|chromos|хромос|염색체/,ids:['dna','mutation','genotype']},
    {pattern:/eco|эколог|환경|생태|climate|климат/,ids:['ecosystem','biodiversity','biosphere']},
    {pattern:/protein|белок|단백질/,ids:['ribosome','translation','proteomics']},
    {pattern:/cell|клетк|세포/,ids:['cell','mitosis','nucleus']}
  ];
  for(const row of synonymTopic)if(row.pattern.test(key))for(const id of row.ids){topics.push(id);chosen.add(id);}
  const tokens=key.split(/\s+/).filter(x=>x.length>=2);
  const scored=TERMS_DB.map(term=>{
    const variants=WIKI_LANGUAGES.map(lang=>normalizedQuery(term[lang]));
    let score=chosen.has(term.id)?300:0;
    for(const word of tokens){
      for(const v of variants){
        if(v.includes(word)||word.includes(v))score=Math.max(score,100+Math.min(word.length,10));
        else {
          const grams=(x)=>{const result=[];for(let i=0;i<x.length-1;i++)result.push(x.slice(i,i+2));return result;};
          const qGrams=grams(word),vGrams=new Set(grams(v));
          const overlap=qGrams.filter(g=>vGrams.has(g)).length;
          score=Math.max(score,Math.round(60*overlap/Math.max(2,qGrams.length)));
        }
      }
    }
    return {term,score};
  });
  scored.sort((a,b)=>b.score-a.score||TERMS_DB.indexOf(a.term)-TERMS_DB.indexOf(b.term));
  const out=[];for(const id of topics){if(!out.includes(id))out.push(id);if(out.length===3)break;}
  for(const x of scored){if(!out.includes(x.term.id))out.push(x.term.id);if(out.length===3)break;}
  return out;
}
async function wikiRequest(host,params,signal) {
  const url=new URL(`https://${host}/w/api.php`);
  for(const [k,v] of Object.entries({format:'json',origin:'*',...params}))url.searchParams.set(k,String(v));
  const response=await fetch(url.toString(),{method:'GET',mode:'cors',credentials:'omit',signal});
  if(!response.ok)throw new Error('WIKIMEDIA_HTTP_ERROR');
  const data=await response.json();if(data.error)throw new Error('WIKIMEDIA_API_ERROR');
  return data;

    let wikiPage=page?.lang===lang?page:null;
    if(title && !wikiPage){try{wikiPage=await wikipediaPage(lang,title,signal,false);}catch(error){if(signal.aborted)throw error;}}
    const label=wdText(entity,'labels',lang),description=wdText(entity,'descriptions',lang);

      url:title?wikiArticleUrl(lang,title):qid?`https://www.wikidata.org/wiki/${qid}`:''};

function awardSearchBonus(result) {
  syncDailySearchRewards();
  if(APP_STATE.searchedIds.includes(result.id))return 'duplicate';
  if(APP_STATE.dailySearchRewards.count>=SEARCH_DAILY_REWARD_LIMIT)return 'limit';
  APP_STATE.searchedIds.push(result.id);
  APP_STATE.dailySearchRewards.count++;
  rewardEco(5);
  return 'earned';
}
function showSearchRewardNotice(status) {
  toast(t(status==='earned'?'searchBonus':status==='limit'?'searchLimitReached':'searchAlready'));
}
async function runEncyclopediaSearch(optionalQuery) {
  const field=document.getElementById('wikiQuery');
  const query=cleanSearchText(optionalQuery??field?.value??APP_STATE.searchQuery);
  APP_STATE.searchQuery=query;
  if(query.length<2){APP_STATE.searchErrorKey='queryShort';APP_STATE.searchSuggestions=[];APP_STATE.searchResult=null;renderAll();return;}
  // Instant visual feedback, including fast local matches. Preserve serial to discard stale responses.
  APP_STATE.requestSerial++;
  const serial=APP_STATE.requestSerial;
  APP_STATE.requestController?.abort();APP_STATE.requestController=null;
  APP_STATE.searchLoading=true;APP_STATE.searchErrorKey=null;
  APP_STATE.searchResult=null;APP_STATE.searchSuggestions=[];renderAll();
  // Yield a paint frame so users see the loading state even for an immediate local hit.
  await new Promise(resolve=>setTimeout(resolve,60));
  if(serial!==APP_STATE.requestSerial)return;
  const local=getLocalTerm(query);
  if(local){
    APP_STATE.searchLoading=false;APP_STATE.searchResult=makeLocalResult(local,query);
    const status=awardSearchBonus(APP_STATE.searchResult);
    renderAll();showSearchRewardNotice(status);return;
  }
  // Hard 4-second deadline across Wikipedia + Wikidata; abort all network calls.
  const controller=new AbortController();APP_STATE.requestController=controller;
  let timerId;
  const timeout=new Promise((_,reject)=>{
    timerId=setTimeout(()=>{controller.abort();reject(new Error('SEARCH_TIMEOUT'));},4000);
  });
  try {
    const result=await Promise.race([lookupEncyclopedia(query,controller.signal),timeout]);
    if(serial!==APP_STATE.requestSerial)return;
    if(result){
      APP_STATE.searchResult=result;
      const status=awardSearchBonus(result);
      showSearchRewardNotice(status);
    } else {
      APP_STATE.searchErrorKey='searchNotFound';APP_STATE.searchSuggestions=getSearchSuggestions(query);
    }
  } catch(error){
    if(serial!==APP_STATE.requestSerial)return;
    APP_STATE.searchErrorKey='searchFallback';APP_STATE.searchSuggestions=getSearchSuggestions(query);
    console.info('Encyclopedia offline / timeout; local suggestions displayed.');
  } finally {
    clearTimeout(timerId);
    if(serial===APP_STATE.requestSerial){APP_STATE.requestController=null;APP_STATE.searchLoading=false;renderAll();}
  }
}

// Reserve a name only after both checking its availability and getting a

function normalizeNickname(name) {
  return String(name||'').trim().normalize('NFKC').toLowerCase();

  return String(name).replace(/[\\%_]/g,character=>'\\'+character);

    await new Promise(resolve=>setTimeout(resolve,40));

}
async function saveProfile() {
  if(APP_STATE.nicknameChecking || !COUNTRIES.includes(APP_STATE.draftCountry))return;
  const field=document.getElementById('nicknameInput');
  const name=String(field?.value ?? APP_STATE.draftNickname ?? '').trim();
  const country=APP_STATE.draftCountry;
  if(!name || name.length>22) { showNicknameError('invalidName'); return; }
  APP_STATE.draftNickname=name;
  APP_STATE.nicknameErrorKey=null;APP_STATE.nicknameErrorDetail=null;
  if(isReservedBotNickname(name)) { showNicknameError('nickTaken'); return; }
  if(!sbClient || typeof navigator!=='undefined' && navigator.onLine===false) {
    showNicknameError('nickUnavailable',!sbClient?'Supabase JS SDK was not initialized':'Browser is offline');return;
  }
  APP_STATE.nicknameChecking=true;
  const requestId=++APP_STATE.nicknameCheckSerial;
  const modal=APP_STATE.modalMode;
  renderAll();
  let guard=null;
  let acquiredWriteLock=false;
  const isCurrent=()=>requestId===APP_STATE.nicknameCheckSerial && APP_STATE.modalMode===modal;
  try {
    // Wait for the initial cloud profile read, so we never overwrite a newer
    // remote progress snapshot with an older local onboarding snapshot.
    if(!cloudProfileChecked)await startCloudInitialization();
    if(!isCurrent())return;
    if(!cloudProfileChecked)throw new Error('Cloud profile is not available');
    guard=cloudDeadline();
    const {data:otherUsers,error:checkError}=await sbClient.from('users')
      .select('user_id')
      .ilike('nickname',escapeIlikeLiteral(name))
      .neq('user_id',USER_ID)
      .limit(1)
      .abortSignal(guard.signal);
    if(checkError){reportCloudError('nickname SELECT ilike',checkError);throw checkError;}
    if(!isCurrent())return;
    if(otherUsers?.length){showNicknameError('nickTaken');return;}

    // A successful lookup is not enough: claim the name atomically now.
    // If another user wins a race, PostgreSQL returns 23505.
    await waitForCloudWrite(guard.signal);
    if(!isCurrent())return;
    cloudSaveInFlight=true;
    acquiredWriteLock=true;
    clearTimeout(cloudDebounceTimer);
    const data={...getPersistentState(),nickname:name,country};
    await writeCloudProfile({
      user_id:USER_ID,nickname:name,country,
      eco:safeNumber(APP_STATE.eco),streak:safeNumber(effectiveStreak()),
      state_json:data,updated_at:new Date().toISOString()
    },guard.signal);
    if(!isCurrent())return;
    APP_STATE.nickname=name;
    APP_STATE.country=country;
    APP_STATE.modalMode=null;
    APP_STATE.nicknameChecking=false;
    APP_STATE.nicknameErrorKey=null;APP_STATE.nicknameErrorDetail=null;
    lastConfirmedNickname=name;
    localEditedAt=Date.now();
    localDirty=false;
    lastSavedSnapshot=JSON.stringify(getPersistentState());
    storeLocalEnvelope(getPersistentState());
    APP_STATE.cloudLastSyncedAt=Date.now();
    APP_STATE.cloudStatus='synced';
    pendingCloudWrite=false;
    renderAll();toast(t('savedProfile'));haptic();
    if(APP_STATE.activeTab==='ranking')void refreshCloudRanking({silent:true});
  }catch(error){
    reportCloudError('nickname verification / save',error);
    if(!isCurrent())return;
    const duplicate=String(error?.code||'')==='23505' || String(error?.code||'')==='23514' && isReservedBotNickname(name);
    showNicknameError(duplicate?'nickTaken':'nickUnavailable',duplicate?'':cloudErrorMessage(error));
  }finally{
    guard?.clear();
    if(acquiredWriteLock)cloudSaveInFlight=false;
    if(isCurrent() && APP_STATE.nicknameChecking){APP_STATE.nicknameChecking=false;renderAll();}
    if(pendingCloudWrite && !APP_STATE.nicknameChecking){pendingCloudWrite=false;scheduleCloudSave();}
  }
}

function cloudErrorMessage(error){

// Missing optional columns must not break signup or ECO. For a complete cloud
// progress history, keep state_json in the public.users schema.
const cloudOptionalColumns=new Set(['state_json','updated_at']);
function cloudMissingColumn(error){
  const code=String(error?.code||'');
  const msg=String(error?.message||'');
  if(!['PGRST204','42703'].includes(code)&&!/column.*(does not exist|schema cache|could not find)/i.test(msg))return null;
  const matched=msg.match(/['"`]((?:state_json|updated_at))['"`]/i) || msg.match(/(?:users\.)?(state_json|updated_at)\b/i);
  return matched?.[1]||null;
}
async function readCloudProfile(userId,signal){
  for(let attempt=0;attempt<3;attempt++){
    const fields=['user_id','nickname','country','eco','streak',...cloudOptionalColumns].join(',');
    const result=await sbClient.from('users').select(fields).eq('user_id',userId).maybeSingle().abortSignal(signal);
    if(!result.error)return result.data;
    const missing=cloudMissingColumn(result.error);
    reportCloudError('profile SELECT '+fields,result.error);
    if(missing&&cloudOptionalColumns.has(missing)){cloudOptionalColumns.delete(missing);continue;}
    throw result.error;
  }
  throw new Error('Optional Supabase columns could not be resolved');
}
async function writeCloudProfile(row,signal){
  for(let attempt=0;attempt<3;attempt++){
    const filtered={...row};
    for(const col of ['state_json','updated_at'])if(!cloudOptionalColumns.has(col))delete filtered[col];
    const {error}=await sbClient.from('users').upsert(filtered,{onConflict:'user_id'}).abortSignal(signal);
    if(!error){
      if(!cloudOptionalColumns.has('state_json')&&!window.__namulabSchemaNotified){
        window.__namulabSchemaNotified=true;
        toast(t('cloudSchemaMissing'));
      }
      return;
    }
    const missing=cloudMissingColumn(error);
    reportCloudError('profile UPSERT',error);
    if(missing&&cloudOptionalColumns.has(missing)){cloudOptionalColumns.delete(missing);continue;}
    throw error;
  }
  throw new Error('Supabase profile UPSERT failed after schema compatibility checks');
}
function cloudDeadline(){

function mergeArrayUnion(local,remote,max=20000){return uniqueStrings([...(Array.isArray(local)?local:[]),...(Array.isArray(remote)?remote:[])],max);}
function mergeStatesForPendingLocal(local,remote){
  const target=normalizeState(remote);

  target.learnedIds=mergeArrayUnion(local.learnedIds,remote.learnedIds).filter(id=>TERMS_DB.some(t=>t.id===id));
  target.rewardedTermIds=mergeArrayUnion(local.rewardedTermIds,remote.rewardedTermIds);
  target.searchedIds=mergeArrayUnion(local.searchedIds,remote.searchedIds);
  target.examRewardKeys=mergeArrayUnion(local.examRewardKeys,remote.examRewardKeys);
  target.solvedCaseIds=mergeArrayUnion(local.solvedCaseIds,remote.solvedCaseIds).filter(id=>LAB_CASES_DB.some(c=>c.id===id));
  target.weakTermIds=mergeArrayUnion(local.weakTermIds,remote.weakTermIds);
  const seen=new Set();
  target.favorites=[...(local.favorites||[]),...(remote.favorites||[])].filter(item=>item?.id&&!seen.has(item.id)&&seen.add(item.id)).slice(0,150);
  target.eco=Math.max(local.eco,remote.eco);
  target.streak=Math.max(local.streak,remote.streak);
  const days=[local.lastStudyDate,remote.lastStudyDate].filter(Boolean).sort();
  target.lastStudyDate=days.at(-1)||null;
  const ls=local.examStats,rs=remote.examStats;
  target.examStats={attempts:Math.max(ls.attempts,rs.attempts),total:Math.max(ls.total,rs.total),correct:Math.max(ls.correct,rs.correct),passed:Math.max(ls.passed,rs.passed)};
  target.caseAttempts={...remote.caseAttempts,...local.caseAttempts};
  target.nickname=local.nickname||remote.nickname;
  target.country=local.country||remote.country;
  target.language=local.language;
  target.selectedLevel=local.selectedLevel;
  target.examMode=local.examMode;

  const newest=dates.reduce((a,b)=>!a || String(b.date||'')>String(a.date||'')?b:a,null);
  target.dailySearchRewards={date:newest?.date||null,count:Math.max(0,...dates.filter(d=>d.date===newest?.date).map(d=>d.count||0))};

function installPersistedState(next,remoteTime,keepDirty=false){

function scheduleCloudSave(){

async function flushCloudSave(){
  if(!sbClient || !cloudBootstrapped || !cloudProfileChecked || !localDirty || !APP_STATE.country || !APP_STATE.nickname)return;
  if(APP_STATE.nicknameChecking){pendingCloudWrite=true;return;}
  if(cloudSaveInFlight){pendingCloudWrite=true;return;}
  if(typeof navigator!=='undefined' && navigator.onLine===false){setCloudStatus('offline');return;}
  cloudSaveInFlight=true;
  setCloudStatus('syncing');
  const data=getPersistentState();
  const snapshot=JSON.stringify(data);
  const row={
    user_id:USER_ID,nickname:APP_STATE.nickname,country:APP_STATE.country,
    eco:safeNumber(APP_STATE.eco),streak:safeNumber(effectiveStreak()),
    state_json:data,updated_at:new Date().toISOString()
  };
  const guard=cloudDeadline();
  try {
    await writeCloudProfile(row,guard.signal);
    lastConfirmedNickname=row.nickname;
    if(snapshot===JSON.stringify(getPersistentState())){
      localDirty=false;
      commitLocalCache();
    }else{
      pendingCloudWrite=true;
    }
    APP_STATE.cloudLastSyncedAt=Date.now();
    setCloudStatus('synced');
    if(APP_STATE.activeTab==='ranking')void refreshCloudRanking({silent:true});
  } catch(error){
    reportCloudError('autosave; local progress preserved',error,true);
    if(String(error?.code||'')==='23505'){

      APP_STATE.nicknameErrorKey='nickTaken';
      APP_STATE.draftNickname=proposed;
      APP_STATE.draftCountry=APP_STATE.country;
      APP_STATE.nickname=lastConfirmedNickname||'';
      APP_STATE.modalMode=APP_STATE.nickname?'edit':'onboarding';
      renderAll();

    } else setCloudStatus(navigator.onLine===false?'offline':'error');

async function initializeCloud(){
  if(!sbClient){cloudBootstrapped=true;setCloudStatus('offline');return;}
  const readAtStart=lastSavedSnapshot;
  cloudReadRevision++;
  const token=cloudReadRevision;
  const guard=cloudDeadline();
  try{
    const remote=await readCloudProfile(USER_ID,guard.signal);
    if(token!==cloudReadRevision)return;
    if(remote){
      lastConfirmedNickname=String(remote.nickname||'').trim();
      const remoteState=normalizeState({...remote.state_json,
        nickname:remote.nickname,country:remote.country,eco:remote.eco,streak:remote.streak});
      const remoteTime=readTimestamp(remote.updated_at);
      const editedWhileLoading=readAtStart!==JSON.stringify(getPersistentState());
      const shouldUseRemote=remoteState.eco>APP_STATE.eco || remoteTime>localEditedAt;
      if(editedWhileLoading){
        installPersistedState(mergeStatesForPendingLocal(getPersistentState(),remoteState),Date.now(),true);
      } else if(shouldUseRemote && !localDirty){
        installPersistedState(remoteState,remoteTime,false);
        toast(t('cloudRestored'));
      } else if(shouldUseRemote && localDirty && localEditedAt>remoteTime){
        // Local offline changes were made later; merge rather than erase them.
        installPersistedState(mergeStatesForPendingLocal(getPersistentState(),remoteState),Date.now(),true);
      } else if(shouldUseRemote){
        installPersistedState(remoteState,remoteTime,false);
        toast(t('cloudRestored'));
      }
      if(!localDirty && !shouldUseRemote)commitLocalCache();
    }
    cloudProfileChecked=true;
    setCloudStatus('synced');
    cloudBootstrapped=true;
    if(!remote || localDirty)scheduleCloudSave();
  }catch(error){
    reportCloudError('startup profile read',error,true);
    cloudBootstrapped=true;
    setCloudStatus(navigator.onLine===false?'offline':'error');
    // Wait for reconnection before attempting the initial upsert: do not
    // overwrite a remote profile that could not be read.
  }finally{
    guard.clear();
    if(APP_STATE.activeTab==='ranking')void refreshCloudRanking({silent:true});
  }
}
function startCloudInitialization(){
  if(cloudProfileChecked)return Promise.resolve();

async function fetchCountryTotals(signal){
  // Fast, scalable path if the optional SQL aggregation function exists.
  try {
    const {data,error}=await sbClient.rpc('get_country_totals').abortSignal(signal);
    if(!error && Array.isArray(data)){
      const sums={KZ:0,KR:0,US:0};
      for(const item of data){const country=validCountry(item.country);if(country)sums[country]+=safeNumber(Number(item.total_eco ?? item.eco_total ?? item.eco));}
      return sums;
    }
  }catch(error){if(signal.aborted)throw error;}
  // Portable fallback: page through ALL profiles; do not confuse top-50
  // with country totals. For large communities, deploy the RPC above.
  const totals={KZ:0,KR:0,US:0};
  for(let start=0;start<100000;start+=CLOUD_PAGE_SIZE){
    const {data,error}=await sbClient.from('users')
      .select('country,eco').range(start,start+CLOUD_PAGE_SIZE-1).abortSignal(signal);
    if(error)throw error;
    for(const item of data||[]){const country=validCountry(item.country);if(country)totals[country]+=safeNumber(item.eco);}
    if(!data || data.length<CLOUD_PAGE_SIZE)return totals;
  }
  throw new Error('Country totals require the get_country_totals RPC for a community of 100,000+ users');
}
const CLOUD_BACKGROUND_RANKING_REFRESH_MS = 45000;
let cloudRankingLastFetchAt = 0;
let cloudRankingLastOrder = null;
function rankingVisualSnapshot() {
  return JSON.stringify({players:APP_STATE.cloudPlayers, totals:APP_STATE.cloudTotals,
    available:APP_STATE.cloudTotalsAvailable, self:APP_STATE.cloudSelfAtTotals,
    status:APP_STATE.cloudStatus});
}
async function refreshCloudRanking({silent=false,force=false}={}){
  const requestedOrder = APP_STATE.sortBy==='streak'?'streak':'eco';
  if (silent && !force && APP_STATE.cloudTotalsAvailable &&
      cloudRankingLastOrder===requestedOrder &&
      Date.now()-cloudRankingLastFetchAt<CLOUD_BACKGROUND_RANKING_REFRESH_MS) return;
  if(!sbClient){setCloudStatus('offline');if(!silent)toast(t('cloudNoServer'));return;}
  if(APP_STATE.cloudRefreshing){cloudRefreshAgain=true;return;}
  const id=++cloudRankingRequest;
  APP_STATE.cloudRefreshing=true;
  if(!silent)renderAll();
  const guard=cloudDeadline();
  let visualChange=false;
  try {
    const order=APP_STATE.sortBy==='streak'?'streak':'eco';
    const [topResult,totals,selfResult]=await Promise.all([
      sbClient.from('users').select('user_id,nickname,country,eco,streak')
        .order(order,{ascending:false}).limit(50).abortSignal(guard.signal),
      fetchCountryTotals(guard.signal),
      sbClient.from('users').select('user_id,country,eco')
        .eq('user_id',USER_ID).maybeSingle().abortSignal(guard.signal)
    ]);
    if(topResult.error)throw topResult.error;
    if(selfResult.error)throw selfResult.error;
    if(id!==cloudRankingRequest)return;
    const result=[];const seen=new Set();
    for(const row of topResult.data||[]){const user=sanitizeCloudPlayer(row);if(user&&!seen.has(user.id)){seen.add(user.id);result.push(user);}}
    const before=rankingVisualSnapshot();
    APP_STATE.cloudPlayers=result;
    APP_STATE.cloudTotals=totals;
    APP_STATE.cloudTotalsAvailable=true;
    APP_STATE.cloudSelfAtTotals=selfResult.data&&validCountry(selfResult.data.country)
      ?{country:validCountry(selfResult.data.country),eco:safeNumber(selfResult.data.eco)}:null;
    if(APP_STATE.cloudStatus!=='syncing' && cloudProfileChecked)APP_STATE.cloudStatus='synced';
    cloudRankingLastFetchAt=Date.now();
    cloudRankingLastOrder=order;
    // JSON-based equality check: do not rebuild an unchanged leaderboard.
    visualChange=before!==rankingVisualSnapshot();
    if(!silent)toast(t('cloudRefreshDone'));
  }catch(error){
    reportCloudError('leaderboard / country totals',error,!silent);
    if(id===cloudRankingRequest){
      if(APP_STATE.cloudStatus!=='syncing')setCloudStatus(navigator.onLine===false?'offline':'error');
      if(!silent)toast(t('cloudRefreshFail'));
    }
  }finally{
    guard.clear();APP_STATE.cloudRefreshing=false;
    if(!silent || visualChange)renderAll();
    if(cloudRefreshAgain){cloudRefreshAgain=false;void refreshCloudRanking({silent:true});}
  }
}

    // A successful UPDATE with zero visible rows usually means the RLS policy denies it.
    const {data,error}=await sbClient.from('app_settings')
      .update({announcement_text:text,is_active:active})
      .eq('id',1).select('id,announcement_text,is_active').maybeSingle()
      .abortSignal(guard.signal);
    if(error)throw error;
    if(!data)throw new Error('app_settings id=1 not found or UPDATE blocked by RLS/GRANT');
    APP_STATE.adminNoticeActive=active;
    APP_STATE.announcement={id:1,announcement_text:text,is_active:active,updated_at:text};
    APP_STATE.announcementDismissedKey=null;
    toast(t('adminPublished'));
  }catch(error){adminFailure(error);}
  finally{guard.clear();APP_STATE.adminBusy=false;renderAll();}
}
function selectAdminEco(userId){
  const p=APP_STATE.adminPlayers.find(row=>row.id===userId);
  if(!p||!APP_STATE.adminVerified)return;
  APP_STATE.adminEditUserId=userId;
  APP_STATE.adminEcoInput=String(p.eco);
  APP_STATE.adminConfirm=null;APP_STATE.adminErrorKey=null;APP_STATE.adminErrorDetail=null;renderAll();
}
async function saveAdminEco(){
  if(!APP_STATE.adminVerified||APP_STATE.adminBusy)return;
  const value=Number(APP_STATE.adminEcoInput);
  if(!Number.isSafeInteger(value)||value<0||value>1000000000){APP_STATE.adminErrorKey='adminError';renderAll();return;}
  const userId=APP_STATE.adminEditUserId;
  if(!APP_STATE.adminPlayers.some(row=>row.id===userId))return;
  APP_STATE.adminBusy=true;APP_STATE.adminErrorKey=null;APP_STATE.adminErrorDetail=null;renderAll();
  const guard=cloudDeadline();
  try{
    if(!sbClient)throw new Error('Supabase JS SDK unavailable');
    // These direct mutations require an owner-restricted RLS policy.
    const {data,error}=await sbClient.from('users').update({eco:value})
      .eq('user_id',userId).select('user_id').maybeSingle().abortSignal(guard.signal);
    if(error)throw error;
    if(!data)throw new Error('User ECO UPDATE was denied by RLS or the user does not exist');
    APP_STATE.adminEditUserId=null;
    if(userId===USER_ID)APP_STATE.eco=value;
    APP_STATE.adminPlayers=APP_STATE.adminPlayers.map(p=>p.id===userId?{...p,eco:value}:p);
    toast(t('adminSaved'));
    void refreshCloudRanking({silent:true});
  }catch(error){adminFailure(error);}
  finally{guard.clear();APP_STATE.adminBusy=false;renderAll();}
}
function askAdminConfirm(kind,userId){
  if(!APP_STATE.adminVerified||!['reset','delete'].includes(kind))return;
  const p=APP_STATE.adminPlayers.find(row=>row.id===userId);
  if(!p)return;
  APP_STATE.adminConfirm={kind,id:p.id,name:p.name};
  APP_STATE.adminEditUserId=null;APP_STATE.adminErrorKey=null;APP_STATE.adminErrorDetail=null;renderAll();
}
async function executeAdminConfirm(){
  const task=APP_STATE.adminConfirm;
  if(!APP_STATE.adminVerified||APP_STATE.adminBusy||!task)return;
  APP_STATE.adminBusy=true;APP_STATE.adminErrorKey=null;APP_STATE.adminErrorDetail=null;renderAll();
  const guard=cloudDeadline();
  try{
    if(!sbClient)throw new Error('Supabase JS SDK unavailable');
    let data,error;
    if(task.kind==='delete'){
      ({data,error}=await sbClient.from('users').delete()
        .eq('user_id',task.id).select('user_id').maybeSingle().abortSignal(guard.signal));
    }else{
      const random=typeof crypto?.randomUUID==='function'?crypto.randomUUID().replace(/-/g,'').slice(0,14):Math.random().toString(36).slice(2,16);
      const guestName='Guest_'+random;
      ({data,error}=await sbClient.from('users').update({nickname:guestName})
        .eq('user_id',task.id).select('user_id').maybeSingle().abortSignal(guard.signal));
    }
    if(error)throw error;
    if(!data)throw new Error('Player mutation blocked by RLS/GRANT or user not found');
    APP_STATE.adminConfirm=null;
    toast(t('adminSaved'));
    if(task.kind==='delete'){
      APP_STATE.adminPlayers=APP_STATE.adminPlayers.filter(row=>row.id!==task.id);
      APP_STATE.adminTotalPlayers=Math.max(0,APP_STATE.adminTotalPlayers-1);
    }
    APP_STATE.adminBusy=false;
    void loadAdminPlayers();
    void refreshCloudRanking({silent:true});
  }catch(error){adminFailure(error);}
  finally{guard.clear();APP_STATE.adminBusy=false;renderAll();}
}

function handleAction(action,element) {
  switch(action){
    case 'openAdmin':openAdmin();break;
    case 'adminClose':closeAdmin();break;
    case 'dismissAnnouncement':dismissAnnouncement();break;
    case 'adminRefresh':void loadAdminPlayers();break;
    case 'adminPublish':void publishAdminAnnouncement();break;
    case 'adminSelectEco':selectAdminEco(element.dataset.adminUser);break;
    case 'adminSaveEco':void saveAdminEco();break;
    case 'adminAskResetNick':askAdminConfirm('reset',element.dataset.adminUser);break;
    case 'adminAskDelete':askAdminConfirm('delete',element.dataset.adminUser);break;
    case 'adminExecuteConfirm':void executeAdminConfirm();break;
    case 'adminCancelConfirm':APP_STATE.adminConfirm=null;renderAll();break;
    case 'adminPrevious':if(APP_STATE.adminPage>0){APP_STATE.adminPage--;void loadAdminPlayers();}break;
    case 'adminNext':if((APP_STATE.adminPage+1)*APP_STATE.adminPageSize<APP_STATE.adminTotalPlayers){APP_STATE.adminPage++;void loadAdminPlayers();}break;
    case 'flip': APP_STATE.flipped=!APP_STATE.flipped;renderAll();haptic();break;
    case 'learn':completeLesson();break;
    case 'refreshCloud':if(!cloudProfileChecked){void startCloudInitialization();}void refreshCloudRanking();break;
    case 'speak':{
      const lang=element.dataset.speakLang;
      const text=element.dataset.speakSource==='search' ? APP_STATE.searchResult?.versions?.[lang]?.title : getCurrentTerm()?.[lang];
      if(text&&['en','ko'].includes(lang))speak(text,lang);break;
    }
    case 'closeSearch':closeEncyclopedia();break;
    case 'toggleFavorite':toggleFavorite();break;
    case 'editNick':case 'editCountry':openEditProfile();break;
    case 'saveProfile':void saveProfile();break;
    case 'cancelModal':APP_STATE.nicknameCheckSerial++;APP_STATE.nicknameChecking=false;APP_STATE.nicknameErrorKey=null;APP_STATE.modalMode=null;renderAll();break;
    case 'resetProgress':APP_STATE.modalMode='reset';renderAll();break;
    case 'confirmReset':resetLearning();break;
    case 'openFavorite':openFavorite(Number(element.dataset.favorite));break;
    case 'deleteFavorite':deleteFavorite(Number(element.dataset.favorite));break;
    case 'goProfile':switchTab('profile');break;
    case 'shareProgress':openShareProgress();break;
    case 'downloadShare':downloadShareCard();break;
    case 'sendShare':sendShareCard();break;
    case 'retryCase':retryCase();break;
    case 'studyRelated':studyRelatedTerm(element.dataset.termId);break;
    case 'releaseFocus':APP_STATE.focusTermId=null;renderAll();break;
    case 'startExam':createExam();break;
    case 'examNext':advanceExam();break;
  }
}

document.addEventListener('input',event=>{
  if(event.target?.id==='nicknameInput'){
    APP_STATE.draftNickname=event.target.value;
    if(APP_STATE.nicknameErrorKey){
      APP_STATE.nicknameErrorKey=null;APP_STATE.nicknameErrorDetail=null;
      document.getElementById('nicknameError')?.remove();
      event.target.setAttribute('aria-invalid','false');
    }
  }
  if(event.target?.id==='wikiQuery')APP_STATE.searchQuery=event.target.value;
  if(event.target?.id==='adminPinField'){
    APP_STATE.adminPINInput=event.target.value;
    if(APP_STATE.adminPINErrorKey){APP_STATE.adminPINErrorKey=null;document.querySelector('.admin-message[role="alert"]')?.remove();}
  }
  if(event.target?.id==='adminAnnouncementText')APP_STATE.adminNoticeText=event.target.value;
  if(event.target?.id==='adminEcoInput')APP_STATE.adminEcoInput=event.target.value;
});
document.addEventListener('change',event=>{
  if(event.target?.id==='adminAnnouncementActive')APP_STATE.adminNoticeActive=Boolean(event.target.checked);
});
document.addEventListener('submit',event=>{
  if(event.target?.id==='adminPinForm'){
    event.preventDefault();APP_STATE.adminPINInput=document.getElementById('adminPinField')?.value||'';
    void verifyAdmin();return;
  }
  if(event.target?.id==='wikiSearchForm'){
    event.preventDefault();runEncyclopediaSearch();
  }
});
document.addEventListener('click',event=>{
  const button=event.target.closest('button,[data-action="flip"]');
  if(!button)return;
  if(button.dataset.adminTab){chooseAdminTab(button.dataset.adminTab);return;}
  if(button.dataset.language){changeLanguage(button.dataset.language);return;}
  if(button.dataset.country){
    const input=document.getElementById('nicknameInput');if(input)APP_STATE.draftNickname=input.value;
    if(APP_STATE.nicknameChecking)return;
    APP_STATE.draftCountry=button.dataset.country;
    APP_STATE.nicknameErrorKey=null;APP_STATE.nicknameErrorDetail=null;
    renderAll();return;
  }
  if(button.dataset.tab){switchTab(button.dataset.tab);return;}
  if(button.dataset.level){chooseLevel(button.dataset.level);return;}
  if(button.dataset.sort){APP_STATE.sortBy=button.dataset.sort;renderAll();void refreshCloudRanking({silent:true});return;}
  if(button.dataset.caseFilter){setCaseFilter(button.dataset.caseFilter);return;}
  if(button.dataset.caseId){selectCase(button.dataset.caseId);return;}
  if(button.dataset.caseAnswer!==undefined){answerCase(Number(button.dataset.caseAnswer));return;}
  if(button.dataset.mode){chooseMode(button.dataset.mode);return;}
  if(button.dataset.choice!==undefined){answerExam(Number(button.dataset.choice));return;}
  if(button.dataset.suggest){
    const term=TERMS_DB.find(x=>x.id===button.dataset.suggest);
    if(term)runEncyclopediaSearch(term[APP_STATE.language]);return;
  }
  if(button.dataset.action)handleAction(button.dataset.action,button);
});
document.addEventListener('keydown',event=>{
  if((event.key==='Enter'||event.key===' ')&&document.activeElement?.dataset.action==='flip'){
    event.preventDefault();APP_STATE.flipped=!APP_STATE.flipped;renderAll();
  }
  if(event.key==='Escape'&&APP_STATE.modalMode&&APP_STATE.modalMode!=='onboarding'){
    APP_STATE.nicknameCheckSerial++;APP_STATE.nicknameChecking=false;APP_STATE.nicknameErrorKey=null;
    if(['admin','admin-pin'].includes(APP_STATE.modalMode))closeAdmin();
    else {APP_STATE.modalMode=null;renderAll();}
  }
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){renderAll();if(!cloudProfileChecked)void startCloudInitialization();else if(localDirty)scheduleCloudSave();}
});
window.addEventListener('online',()=>{
  if(!cloudProfileChecked){void startCloudInitialization();return;}
  if(localDirty)scheduleCloudSave();
  if(APP_STATE.activeTab==='ranking')void refreshCloudRanking({silent:true});
});
window.addEventListener('offline',()=>setCloudStatus('offline'));
window.addEventListener('pageshow',()=>renderAll());
renderAll();
void loadPublicAnnouncement();
void startCloudInitialization();

  </script>
</body>
</html>
